[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Ensure `pytest` and `python -m pytest` both resolve the `src` package,
# including on CI runners where the console script does not add the cwd.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
