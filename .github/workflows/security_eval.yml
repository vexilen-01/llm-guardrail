name: LLM Security Benchmark & Guardrail Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q

      - name: Headless security audit
        run: |
          python scripts/run_security_audit.py \
            data/owasp_llm_2025_payloads.json \
            data/test_payloads.json
